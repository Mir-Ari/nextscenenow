<h1>Signing in…</h1>
<p id="msg">Returning to NSN Poster on this computer.</p>
<script>
// OAuth redirect target. The local tool puts its port in "state" (p<port>-<random>) and listens on 127.0.0.1.
(function () {
  var q = new URLSearchParams(location.search), m = /^p(\d{4,5})-/.exec(q.get('state') || '');
  if (m && (q.get('code') || q.get('error'))) { location.replace('http://127.0.0.1:' + m[1] + '/callback' + location.search); return; }
  document.getElementById('msg').textContent = q.get('error') ? 'Sign-in was cancelled or failed.' : 'Nothing to do here.';
})();
</script>
